<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест перед пробным уроком · Полина 宝琳</title>
<meta name="description" content="Короткий тест перед бесплатным пробным уроком китайского: для новичков и для тех, кто уже учил.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Caveat:wght@600;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7F0; --line:#E8E1D6; --wine:#7A1C1C; --ink:#3B2323; --seal:#B3261E; --gold:#D9BC62;
    --soft:#F3EBDD; --ok:#3F6B3A; --bad:#B3261E;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:Rubik,system-ui,sans-serif; color:var(--ink); min-height:100vh;
    background-color:var(--paper);
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:28px 28px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{font-family:Caveat,cursive;font-size:26px;color:var(--wine);font-weight:700}
  .brand b{font-family:'Noto Serif SC',serif;font-size:20px;margin-left:4px}
  .seals{display:flex;gap:6px}
  .seals i{width:14px;height:14px;border:2px solid var(--seal);border-radius:3px;display:block;transform:rotate(-6deg)}
  .seals i.on{background:var(--seal)}
  .card{
    background:#fff;border:2px solid var(--ink);border-radius:14px;padding:24px 20px;
    box-shadow:5px 5px 0 var(--wine);position:relative;
  }
  .card:before{ /* скотч */
    content:"";position:absolute;top:-12px;left:50%;width:90px;height:22px;margin-left:-45px;
    background:rgba(217,188,98,.55);transform:rotate(-3deg);
  }
  .kicker{font-family:Caveat,cursive;font-size:22px;color:var(--seal);margin:0 0 4px}
  h1{font-weight:900;font-size:30px;line-height:1.08;margin:0 0 12px;letter-spacing:-.01em}
  h2{font-weight:800;font-size:22px;line-height:1.15;margin:0 0 10px}
  p{line-height:1.5;margin:0 0 12px}
  .muted{color:#7d6a62;font-size:14px}
  .opts{display:grid;gap:10px;margin-top:14px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.four{grid-template-columns:1fr 1fr}
  button{font:inherit;cursor:pointer}
  .opt{
    background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:13px 12px;
    font-size:17px;font-weight:500;color:var(--ink);text-align:center;transition:transform .12s, background .12s, box-shadow .12s;
  }
  .opt:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
  .opt:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .opt.right{background:#E3EEDC;border-color:var(--ok)}
  .opt.wrong{background:#F6DCD8;border-color:var(--bad)}
  .opt[disabled]{cursor:default}
  .opt.big{font-size:40px;padding:10px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--wine);color:#fff;border:2px solid var(--ink);border-radius:10px;
    padding:14px 18px;font-weight:700;font-size:17px;width:100%;margin-top:16px;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s, box-shadow .12s;
    text-decoration:none;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn.ghost{background:#fff;color:var(--wine)}
  .hz{font-family:'Noto Serif SC',serif;font-weight:900;color:var(--ink);text-align:center;line-height:1}
  .hz.xl{font-size:96px;margin:6px 0 10px}
  .hz.lg{font-size:54px;margin:4px 0 8px}
  .play{
    width:84px;height:84px;border-radius:50%;border:3px solid var(--wine);background:var(--soft);
    color:var(--wine);font-size:30px;display:flex;align-items:center;justify-content:center;margin:8px auto 4px;
  }
  .play.pulse{animation:pulse .6s ease}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .pair{display:flex;gap:14px;justify-content:center}
  .pair .play{margin:8px 0 4px;width:70px;height:70px;font-size:16px;font-weight:700}
  .tray{min-height:58px;border:2px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .chip{
    font-family:'Noto Serif SC',serif;font-size:22px;font-weight:600;padding:8px 12px;border:2px solid var(--ink);
    border-radius:8px;background:var(--paper);color:var(--ink)
  }
  .chip.used{visibility:hidden}
  .pool{display:flex;flex-wrap:wrap;gap:8px}
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .mem div{border:2px solid var(--ink);border-radius:10px;padding:8px 4px;text-align:center;background:var(--paper)}
  .mem .hz{font-size:40px}
  .mem small{display:block;font-size:13px;margin-top:4px}
  .timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
  .timer i{display:block;height:100%;background:var(--wine);width:100%;transition:width linear}
  input[type=text]{
    width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);margin-top:6px
  }
  .note{font-family:Caveat,cursive;font-size:21px;color:var(--wine);margin-top:10px;transform:rotate(-1deg)}
  .res li{margin-bottom:6px;line-height:1.4}
  .stamp{
    display:inline-block;border:3px solid var(--seal);color:var(--seal);font-weight:900;padding:6px 12px;border-radius:6px;
    transform:rotate(-4deg);font-size:20px;margin:4px 0 12px;letter-spacing:.02em
  }
  .feedback{min-height:22px;font-weight:500;margin-top:10px}
  footer{text-align:center;margin-top:22px;font-size:14px;color:#7d6a62}
  footer a{color:var(--wine)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  </header>
  <main class="card" id="app" aria-live="polite"></main>

  ["喜欢",["xǐhuan","xīhuān","qǐhuan","xǐfan"]],
  ["电脑",["diànnǎo","diānnǎo","diànnáo","tiànnǎo"]]
];
const ORDER = [
  {words:["我","昨天","去","商店","了"],ok:["我昨天去商店了","昨天我去商店了"],ru:"Вчера я ходил(а) в магазин."},
  {words:["他","在","学校","学习","汉语"],ok:["他在学校学习汉语"],ru:"Он учит китайский в школе."},
  {words:["我","把","书","放在","桌子上"],ok:["我把书放在桌子上"],ru:"Я положил(а) книгу на стол."}
];
const GOALS = ["Путешествия","Работа или учёба","Сдать HSK","Интерес к языку и культуре","Пока не знаю"];
const HOURS = ["1–2 часа в неделю","3–4 часа","5 и больше"];
const AGES = ["10–13 лет","14–17 лет","18+"];

/* ========= УТИЛИТЫ ========= */
const $app = document.getElementById("app");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wait = ms => new Promise(r=>setTimeout(r,ms));

let zhVoice = null, ttsOk = "speechSynthesis" in window;
function loadVoices(){ if(!ttsOk) return; const v = speechSynthesis.getVoices(); zhVoice = v.find(x=>/zh[-_]CN/i.test(x.lang)) || v.find(x=>/^zh/i.test(x.lang)) || null; }
if(ttsOk){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text){
  return new Promise(res=>{
    if(AUDIO[text]){ const a=new Audio(AUDIO[text]); a.onended=res; a.onerror=res; a.play().catch(res); return; }
    if(!ttsOk){ res(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang="zh-CN"; u.rate=.75; if(zhVoice) u.voice=zhVoice;
    u.onend=res; u.onerror=res; speechSynthesis.speak(u); setTimeout(res,2500);
  });
}
const audioAvailable = () => Object.keys(AUDIO).length>0 || (ttsOk && !!zhVoice);

/* ========= СОСТОЯНИЕ ========= */
const S = { name:"", track:null, age:"", goal:"", hours:"", hard:"", score:{}, notes:[] };
let steps = [], stepIdx = 0;
function seals(){
  const el=document.getElementById("seals"); el.innerHTML="";
  steps.forEach((_,i)=>{ const s=document.createElement("i"); if(i<stepIdx) s.className="on"; el.appendChild(s); });
}
function next(){ stepIdx++; seals(); (steps[stepIdx]||finish)(); window.scrollTo({top:0,behavior:"smooth"}); }

/* общий вопрос с вариантами */
function mcq({kicker,title,body="",options,correct,onAnswer,big=false,cols="four"}){
  $app.innerHTML = `<p class="kicker">${kicker}</p><h2>${title}</h2>${body}
    <div class="opts ${cols}">${options.map((o,i)=>`<button class="opt ${big?'big':''}" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div>`;
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok = correct===undefined ? null : i===correct;
    $app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    if(ok!==null){ b.classList.add(ok?"right":"wrong"); if(!ok) $app.querySelector(`.opt[data-i="${correct}"]`).classList.add("right"); }
    setTimeout(()=>onAnswer(i,ok), ok===null?150:800);
  });
}

/* ========= ЭКРАНЫ ========= */
function start(){
  steps=[]; stepIdx=0; seals();
  $app.innerHTML = `
    <p class="kicker">перед пробным уроком</p>
    <h1>Давайте немного познакомимся с вашим китайским</h1>
    <p>Тест займёт 5–10 минут. Это не экзамен: мне просто нужно понять, с чего начать, чтобы пробный урок прошёл с пользой.</p>
    <label for="nm" class="muted">Как к вам обращаться?</label>
    <input id="nm" type="text" autocomplete="given-name" placeholder="Имя">
    <p class="muted" style="margin-top:14px">Вы уже учили китайский?</p>
    <div class="opts">
      <button class="opt" data-t="new">Нет, совсем с нуля</button>
      <button class="opt" data-t="go">Да, немного или больше</button>
    </div>`;
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    S.name = (document.getElementById("nm").value||"").trim().slice(0,40);
    S.track = b.dataset.t;
    steps = S.track==="new"
      ? [about, soundCheck, sameDiff, picto, memory, wishes]
      : [about, soundCheck, toneId, hskAdaptive, pinyin, order, wishes];
    stepIdx=0; seals(); steps[0]();
  });
}

function about(){
  mcq({kicker:"о вас", title:"Сколько вам лет?", body:`<p class="muted">Если тест проходит ребёнок, можно вместе с родителем.</p>`,
    options:AGES, cols:"", onAnswer:i=>{ S.age=AGES[i]; next(); }});
}

function soundCheck(){
  if(audioAvailable()){ next(); return; }
  $app.innerHTML = `<p class="kicker">звук</p><h2>Ваш браузер не умеет произносить китайские слова</h2>
    <p>Задания на слух пропустим, ничего страшного: тоны послушаю на уроке сама.</p>
    <button class="btn" id="go">Дальше</button>`;
  S.notes.push("задания на слух пропущены: браузер без китайского голоса");
  S.noAudio = true;
  document.getElementById("go").onclick=next;
}

/* --- новички --- */
async function sameDiff(){
  if(S.noAudio){ next(); return; }
  const items = pick(SAME_DIFF,6); let n=0, right=0;
  const one = ()=>{
    if(n>=items.length){ S.score.ear=[right,items.length]; next(); return; }
    const [a,b,same]=items[n];
    $app.innerHTML = `<p class="kicker">слух · ${n+1} из ${items.length}</p>
      <h2>Тон одинаковый или разный?</h2>
      <p class="muted">В китайском один и тот же слог можно произнести четырьмя мелодиями. Послушайте два слога.</p>
      <div class="pair"><button class="play" id="p1" aria-label="Первый слог">1</button><button class="play" id="p2" aria-label="Второй слог">2</button></div>
      <div class="opts two"><button class="opt" data-a="1">Одинаковый</button><button class="opt" data-a="0">Разный</button></div>
      <div class="feedback" id="fb"></div>`;
    const p1=document.getElementById("p1"), p2=document.getElementById("p2");
    p1.onclick=()=>{p1.classList.remove("pulse");void p1.offsetWidth;p1.classList.add("pulse");say(a);};
    p2.onclick=()=>{p2.classList.remove("pulse");void p2.offsetWidth;p2.classList.add("pulse");say(b);};
    (async()=>{ await say(a); await wait(350); await say(b); })();
    $app.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
      const ans = btn.dataset.a==="1", ok = ans===same; if(ok) right++;
      $app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      btn.classList.add(ok?"right":"wrong");
      document.getElementById("fb").textContent = ok ? "Верно!" : (same?"Тон был одинаковый.":"Тоны были разные.");
      n++; setTimeout(one,900);
    });
  };
  one();
}

function picto(){
  const items = pick(PICTO,6); let n=0, right=0;
  const one = ()=>{
    if(n>=items.length){ S.score.picto=[right,items.length]; next(); return; }
    const [hz,emo,ru]=items[n];
    const others = pick(PICTO.filter(p=>p[0]!==hz),3);
    const opts = shuffle([[emo,ru],...others.map(o=>[o[1],o[2]])]);
    mcq({kicker:`угадай иероглиф · ${n+1} из ${items.length}`, title:"Что нарисовано этим иероглифом?",
      body:`<div class="hz xl">${hz}</div>`, options:opts.map(o=>o[0]), correct:opts.findIndex(o=>o[0]===emo), big:true,
      onAnswer:(i,ok)=>{ if(ok) right++; n++; one(); }});
  };
  one();
}

async function memory(){
  const cards = MEMORY;
  $app.innerHTML = `<p class="kicker">память</p><h2>Запомните четыре иероглифа</h2>
    <p class="muted">У вас 8 секунд, потом спрошу, что какой значит.</p>
    <div class="mem">${cards.map(c=>`<div><span class="hz">${c[0]}</span><small>${c[1]}</small></div>`).join("")}</div>
    <div class="timer"><i id="tm"></i></div>`;
  await wait(60); document.getElementById("tm").style.transitionDuration="8s"; document.getElementById("tm").style.width="0%";
  await wait(8000);
  const qs = shuffle(cards); let n=0, right=0;
  const one = ()=>{
    if(n>=qs.length){ S.score.memory=[right,qs.length]; next(); return; }
    const [hz,ru]=qs[n]; const opts=shuffle(cards.map(c=>c[1]));
    mcq({kicker:`память · ${n+1} из ${qs.length}`, title:"Что значит этот иероглиф?", body:`<div class="hz lg">${hz}</div>`,
      options:opts, correct:opts.indexOf(ru), onAnswer:(i,ok)=>{ if(ok) right++; n++; one(); }});
  };
  one();
}

/* --- продолжающие --- */
function toneId(){
  if(S.noAudio){ next(); return; }
  const items = pick(TONES,6); let n=0, right=0;
  const one = ()=>{
    if(n>=items.length){ S.score.tones=[right,items.length]; next(); return; }
    const [hz,t]=items[n];
    $app.innerHTML = `<p class="kicker">тоны · ${n+1} из ${items.length}</p><h2>Какой это тон?</h2>
      <button class="play" id="pl" aria-label="Послушать ещё раз">▶</button>
      <p class="muted" style="text-align:center">нажмите, чтобы послушать ещё раз</p>
      <div class="opts four">${["1 · ā","2 · á","3 · ǎ","4 · à"].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    const pl=document.getElementById("pl");
    pl.onclick=()=>{pl.classList.remove("pulse");void pl.offsetWidth;pl.classList.add("pulse");say(hz);};
    say(hz);
    $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, ok=i===t-1; if(ok) right++;
      $app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      b.classList.add(ok?"right":"wrong"); if(!ok) $app.querySelector(`.opt[data-i="${t-1}"]`).classList.add("right");
      document.getElementById("fb").innerHTML = `Это был <span class="hz" style="font-size:20px">${hz}</span>, ${t}-й тон.`;
      n++; setTimeout(one,1100);
    });
  };
  one();
}

function hskAdaptive(){
  let level=1; const res={};
  const runLevel = ()=>{
    const items = pick(HSK[level],4); let n=0, right=0;
    const one = ()=>{
      if(n>=items.length){
        res[level]=[right,items.length];
        if(right>=3 && level<4){ level++; runLevel(); }
        else { S.score.hsk=res; next(); }
        return;
      }
      const [hz,ru]=items[n];
      const opts = shuffle([ru,...pick(HSK[level].filter(w=>w[1]!==ru).map(w=>w[1]),3)]);
      mcq({kicker:`слова · уровень ${level} · ${n+1} из ${items.length}`, title:"Что значит это слово?",
        body:`<div class="hz lg">${hz}</div>`, options:[...opts,"не знаю"], correct:opts.indexOf(ru), cols:"",
        onAnswer:(i,ok)=>{ if(ok) right++; n++; one(); }});
    };
    one();
  };
  runLevel();
}

function pinyin(){
  const items = pick(PINYIN,4); let n=0, right=0;
  const one = ()=>{
    if(n>=items.length){ S.score.pinyin=[right,items.length]; next(); return; }
    const [hz,opts0]=items[n]; const opts=shuffle(opts0);
    mcq({kicker:`пиньинь · ${n+1} из ${items.length}`, title:"Как правильно записать?", body:`<div class="hz lg">${hz}</div>`,
      options:opts, correct:opts.indexOf(opts0[0]), onAnswer:(i,ok)=>{ if(ok) right++; n++; one(); }});
  };
  one();
}

function order(){
  let n=0, right=0;
  const one = ()=>{
    if(n>=ORDER.length){ S.score.order=[right,ORDER.length]; next(); return; }
    const q=ORDER[n]; const pool=shuffle(q.words.map((w,i)=>({w,i}))); const built=[];
    $app.innerHTML = `<p class="kicker">порядок слов · ${n+1} из ${ORDER.length}</p>
      <h2>Соберите предложение</h2><p>«${q.ru}»</p>
      <div class="tray" id="tray" aria-label="Ваше предложение"></div>
      <div class="pool" id="pool">${pool.map((p,k)=>`<button class="chip" data-k="${k}">${p.w}</button>`).join("")}</div>
      <button class="btn ghost" id="rs">Начать заново</button>
      <div class="feedback" id="fb"></div>`;
    const tray=document.getElementById("tray");
    const draw=()=>{ tray.innerHTML = built.map(k=>`<span class="chip">${pool[k].w}</span>`).join(""); };
    $app.querySelectorAll("#pool .chip").forEach(c=>c.onclick=()=>{
      const k=+c.dataset.k; built.push(k); c.classList.add("used"); c.disabled=true; draw();
      if(built.length===pool.length){
        const s=built.map(k=>pool[k].w).join(""), ok=q.ok.includes(s); if(ok) right++;
        document.getElementById("fb").innerHTML = ok ? "Верно!" : `Правильно так: <span class="hz" style="font-size:20px">${q.ok[0]}</span>`;
        $app.querySelectorAll("button").forEach(x=>x.disabled=true);
        n++; setTimeout(one, ok?900:2000);
      }
    });
    document.getElementById("rs").onclick=()=>{ one(); };
  };
  one();
}

/* --- общее --- */
function wishes(){
  mcq({kicker:"последнее", title:"Зачем вам китайский?", options:GOALS, cols:"", onAnswer:i=>{
    S.goal=GOALS[i];
    mcq({kicker:"последнее", title:"Сколько времени готовы уделять в неделю, вместе с уроками?", options:HOURS, cols:"", onAnswer:j=>{
      S.hours=HOURS[j];
      $app.innerHTML = `<p class="kicker">последнее</p><h2>Что вам кажется самым трудным в китайском?</h2>
        <p class="muted">Можно пропустить.</p>
        <input id="hd" type="text" maxlength="200" placeholder="Например: тоны, иероглифы, понимать на слух">
        <button class="btn" id="go">Посмотреть результат</button>`;
      document.getElementById("go").onclick=()=>{ S.hard=(document.getElementById("hd").value||"").trim().slice(0,200); next(); };
    }});
  }});
}

/* ========= РЕЗУЛЬТАТ ========= */
const f = s => s ? `${s[0]} из ${s[1]}` : "—";
function hskLevel(){
  const r=S.score.hsk||{}; let lvl=0;
  for(const L of [1,2,3,4]){ if(r[L] && r[L][0]>=3) lvl=L; }
  return lvl;
}
function finish(){
  stepIdx=steps.length; seals();
  const hi = S.name ? `${esc(S.name)}, спасибо!` : "Спасибо!";
  let human="", lines=[];
  if(S.track==="new"){
    const p=S.score.picto, m=S.score.memory, e=S.score.ear;
    human = `<span class="stamp">первый шаг сделан</span>
      <p>Вы только что угадывали иероглифы, ни разу их не учив. ${p && p[0]>=4 ? "И почти всё угадали!" : "Многие из них и правда похожи на то, что значат."}</p>
      <ul class="res">
        ${e?`<li>Слух на тоны: ${f(e)}</li>`:""}
        <li>Угадали иероглифов: ${f(p)}</li>
        <li>Запомнили: ${f(m)}</li>
      </ul>
      <p>На пробном уроке попробуем тоны вживую и напишем ваши первые иероглифы.</p>`;
    lines = ["Тест: с нуля", e?`слух на тоны ${f(e)}`:null, `пиктограммы ${f(p)}`, `память ${f(m)}`];
  } else {
    const L=hskLevel();
    const lvlText = L===0 ? "начальный, до HSK 1" : `примерно HSK ${L}${L===4?" и выше":""}`;
    human = `<span class="stamp">${lvlText}</span>
      <ul class="res">
        ${S.score.tones?`<li>Тоны на слух: ${f(S.score.tones)}</li>`:""}
        <li>Пиньинь: ${f(S.score.pinyin)}</li>
        <li>Порядок слов: ${f(S.score.order)}</li>
      </ul>
      <p>Это примерная оценка по нескольким заданиям. Подробнее посмотрим вместе на пробном уроке.</p>`;
    const h=S.score.hsk||{};
    lines = ["Тест: продолжающий", `уровень ${lvlText}`,
      `слова ${Object.keys(h).map(k=>`HSK${k} ${h[k][0]}/${h[k][1]}`).join(", ")}`,
      S.score.tones?`тоны ${f(S.score.tones)}`:null, `пиньинь ${f(S.score.pinyin)}`, `порядок слов ${f(S.score.order)}`];
  }
  lines.push(`возраст: ${S.age}`, `цель: ${S.goal}`, `время: ${S.hours}`);
  if(S.hard) lines.push(`трудно: ${S.hard}`);
  S.notes.forEach(x=>lines.push(x));
  const msg = `Здравствуйте, Полина! Я ${S.name||"(без имени)"}, прошёл(а) тест перед пробным уроком.\n` + lines.filter(Boolean).map(x=>"• "+x).join("\n");
  const url = TG_USER ? `https://t.me/${TG_USER}?text=${encodeURIComponent(msg)}` : `https://t.me/share/url?url=${encodeURIComponent(" ")}&text=${encodeURIComponent(msg)}`;
  $app.innerHTML = `<p class="kicker">готово</p><h1>${hi}</h1>${human}
    <a class="btn" href="${url}" target="_blank" rel="noopener">Отправить результат Полине в Telegram</a>
    <button class="btn ghost" id="cp">Скопировать текст</button>
    <p class="note">После этого договоримся о времени пробного урока ✿</p>`;
  document.getElementById("cp").onclick=async()=>{
    try{ await navigator.clipboard.writeText(msg); document.getElementById("cp").textContent="Скопировано"; }
    catch(e){ prompt("Скопируйте текст:", msg); }
  };
}

start();
</script>
</body>
</html>
