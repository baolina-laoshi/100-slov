<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр тонов · Полина 宝琳</title>
<meta name="description" content="Бесплатный тренажёр китайских тонов на живом голосе преподавателя.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Caveat:wght@600;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF7F0;--line:#E8E1D6;--wine:#7A1C1C;--ink:#3B2323;--seal:#B3261E;--gold:#D9BC62;--ok:#3F6B3A}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);min-height:100vh;background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-family:Caveat,cursive;font-size:26px;color:var(--wine);font-weight:700}.brand b{font-family:'Noto Serif SC',serif;font-size:20px}
.score{font-weight:700;color:var(--wine);font-size:15px}
.card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:24px 20px;box-shadow:5px 5px 0 var(--wine);position:relative}
.card:before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:22px;margin-left:-45px;background:rgba(217,188,98,.55);transform:rotate(-3deg)}
.kicker{font-family:Caveat,cursive;font-size:22px;color:var(--seal);margin:0 0 4px}
h1{font-weight:900;font-size:30px;line-height:1.08;margin:0 0 12px}h2{font-weight:800;font-size:22px;margin:0 0 10px}
p{line-height:1.5;margin:0 0 12px}.muted{color:#7d6a62;font-size:14px}
button{font:inherit;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--wine);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:14px 18px;font-weight:700;font-size:17px;margin-top:12px;box-shadow:3px 3px 0 var(--ink);text-decoration:none}
.btn.ghost{background:#fff;color:var(--wine)}
.mode{text-align:left;display:block}.mode small{display:block;font-weight:400;opacity:.85;font-size:14px;margin-top:2px}
.play{width:96px;height:96px;border-radius:50%;border:3px solid var(--wine);background:#F3EBDD;color:var(--wine);font-size:34px;display:flex;align-items:center;justify-content:center;margin:6px auto 8px}
.play.pulse{animation:p .5s ease}@keyframes p{50%{transform:scale(1.08)}}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.lbl{font-size:13px;color:#7d6a62;margin-top:10px}
.opt{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;color:var(--ink)}
.opt svg{width:56px;height:30px}
.opt.sel{background:#F3EBDD;border-color:var(--wine)}
.opt.right{background:#E3EEDC;border-color:var(--ok)}.opt.wrong{background:#F6DCD8;border-color:var(--seal)}
.opt:focus-visible,.btn:focus-visible,.play:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.reveal{min-height:110px;text-align:center;margin-top:14px}
.hz{font-family:'Noto Serif SC',serif;font-weight:900;font-size:64px;line-height:1.1}
.py{font-family:'Noto Serif SC',serif;font-weight:600;font-size:24px;color:var(--wine)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--wine);width:0;transition:width .3s}
.big{font-weight:900;font-size:56px;color:var(--wine);text-align:center;margin:6px 0}
.note{font-family:Caveat,cursive;font-size:21px;color:var(--wine)}
footer{text-align:center;margin-top:22px;font-size:14px;color:#7d6a62}footer a{color:var(--wine)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const ROUND=10;
const $=s=>document.querySelector(s), app=$('#app');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PATH={1:"M6 8 L50 8",2:"M6 24 L50 6",3:"M6 14 Q22 30 50 6",4:"M6 6 L50 26"};
const NAME={1:"ровный",2:"вверх",3:"ныряет",4:"вниз"};
const svg=t=>`<svg viewBox="0 0 56 32" aria-hidden="true"><path d="${PATH[t]}" fill="none" stroke="#7A1C1C" stroke-width="4" stroke-linecap="round"/></svg>`;
let player=null;
function play(src,btn){ if(player) player.pause(); player=new Audio(src); player.play().catch(()=>{}); if(btn){btn.classList.remove('pulse');void btn.offsetWidth;btn.classList.add('pulse');} }
let best=JSON.parse((()=>{try{return localStorage.getItem('tones_best')||'{}'}catch(e){return '{}'}})());
function saveBest(){try{localStorage.setItem('tones_best',JSON.stringify(best))}catch(e){}}

function home(){
  $('#score').textContent='';
  app.innerHTML=`<p class="kicker">тренажёр</p><h1>Слышишь тоны?</h1>
  <p>В китайском один и тот же слог можно сказать четырьмя мелодиями, и от этого меняется смысл: mā «мама», mǎ «лошадь». Послушай и угадай тон. Всё озвучено живым голосом.</p>
  <div class="row" style="margin:6px 0 4px">${[1,2,3,4].map(t=>`<div class="opt" style="cursor:default">${svg(t)}${t}<span style="font-weight:400;font-size:12px">${NAME[t]}</span></div>`).join('')}</div>
  <button class="btn mode" data-m="one">Один слог<small>10 заданий: угадай тон слога или слова${best.one!=null?` · рекорд ${best.one}/10`:''}</small></button>
  <button class="btn mode" data-m="two">Два слога<small>10 слов: угадай оба тона${best.two!=null?` · рекорд ${best.two}/10`:''}</small></button>
  <button class="btn ghost mode" data-m="mama">Мама или лошадь?<small>Слушай и выбирай иероглиф: 妈 麻 马 骂 и другие четвёрки</small></button>`;
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
}

function start(mode){
  let items;
  if(mode==='one') items=shuffle(DATA.one).slice(0,ROUND);
  else if(mode==='two') items=shuffle(DATA.two).slice(0,ROUND);
  else items=shuffle(DATA.one.slice(0,12)).slice(0,ROUND);
  let n=0,right=0;
  const next=()=>{
    if(n>=items.length) return finish(mode,right,items.length);
    $('#score').textContent=`${right} из ${n}`;
    const it=items[n];
    const head=`<div class="bar"><i style="width:${n/items.length*100}%"></i></div>
      <p class="kicker">${mode==='two'?'два слога':mode==='mama'?'мама или лошадь':'один слог'} · ${n+1} из ${items.length}</p>
      <button class="play" id="pl" aria-label="Послушать ещё раз">▶</button>
      <p class="muted" style="text-align:center">нажми, чтобы послушать ещё раз</p>`;
    if(mode==='mama'){
      const group=DATA.one.slice(0,12).filter((x,i)=>Math.floor(i/4)===Math.floor(DATA.one.indexOf(it)/4));
      app.innerHTML=head+`<h2 style="text-align:center">Какое слово прозвучало?</h2><div class="row">${group.map((g,i)=>`<button class="opt" data-i="${i}"><span class="hz" style="font-size:36px">${g.w}</span><span style="font-weight:400;font-size:13px">${g.p}</span></button>`).join('')}</div><div class="reveal" id="rv"></div>`;
      const pl=$('#pl');pl.onclick=()=>play(it.a,pl);play(it.a,pl);
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        const g=group[+b.dataset.i],ok=g.w===it.w; if(ok) right++;
        app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        b.classList.add(ok?'right':'wrong'); app.querySelectorAll('.opt')[group.indexOf(it)].classList.add('right');
        reveal(it,ok); n++; setTimeout(next,1700);
      });
      return;
    }
    const rows=mode==='two'?2:1; const pick=[];
    app.innerHTML=head+`<h2 style="text-align:center">${mode==='two'?'Какие тоны у двух слогов?':'Какой это тон?'}</h2>`+
      Array.from({length:rows},(_,r)=>`${rows>1?`<div class="lbl">${r+1}-й слог</div>`:''}<div class="row" data-r="${r}">${[1,2,3,4].map(t=>`<button class="opt" data-t="${t}">${svg(t)}${t}</button>`).join('')}</div>`).join('')+`<div class="reveal" id="rv"></div>`;
    const pl=$('#pl');pl.onclick=()=>play(it.a,pl);play(it.a,pl);
    app.querySelectorAll('.row[data-r]').forEach(row=>row.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const r=+row.dataset.r; if(pick[r]) return;
      pick[r]=+b.dataset.t; b.classList.add('sel');
      if(pick.filter(Boolean).length<rows) return;
      let ok=true;
      app.querySelectorAll('.row[data-r]').forEach(rw=>{const rr=+rw.dataset.r;rw.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.remove('sel');const t=+x.dataset.t;if(t===it.t[rr])x.classList.add('right');else if(t===pick[rr]){x.classList.add('wrong');ok=false}})});
      if(ok) right++; reveal(it,ok); n++; setTimeout(next,1800);
    }));
  };
  next();
}
function reveal(it,ok){ $('#rv').innerHTML=`<div class="note">${ok?'верно!':'вот как правильно:'}</div><div class="hz">${it.w}</div><div class="py">${it.p}</div><div class="muted">${it.m}</div>`; }
function finish(mode,right,total){
  $('#score').textContent='';
  if(mode!=='mama'&&(best[mode]==null||right>best[mode])){best[mode]=right;saveBest();}
  const msg=right>=9?'Отличный слух! Тоны тебе точно по силам.':right>=6?'Хорошо! Ещё пара кругов, и будет уверенно.':'Это нормально для начала: тоны тренируются, как мышца.';
  app.innerHTML=`<p class="kicker">готово</p><div class="big">${right} / ${total}</div><p style="text-align:center">${msg}</p>
  <button class="btn" id="again">Ещё раз</button><button class="btn ghost" id="home">Другой режим</button>
  <p class="muted" style="margin-top:16px">Хочешь, чтобы тоны поставил живой преподаватель? Пройди короткий тест и приходи на бесплатный пробный урок.</p>
  <a class="btn ghost" href="https://baolina-laoshi.github.io/100-slov/test.html">Тест перед пробным уроком</a>
  <a class="btn ghost" href="https://t.me/baolinna">Канал @baolinna</a>`;
  $('#again').onclick=()=>start(mode); $('#home').onclick=home;
}
home();
</script></body></html>
